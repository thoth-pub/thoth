[package]
name = "thoth-api-server"
version = "1.3.3"
authors = ["Javier Arias <javi@thoth.pub>", "Ross Higman <ross@thoth.pub>"]
edition = "2021"
license = "Apache-2.0"
description = "Actix instance serving Thoth's GraphQL endpoints"
repository = "https://github.com/thoth-pub/thoth"
readme = "README.md"

[dependencies]
thoth-api = { version = "=1.3.3", path = "../thoth-api", features = ["backend"] }
thoth-errors = { version = "=1.3.3", path = "../thoth-errors" }
actix-web = "4.14.0"
actix-cors = "0.7.1"
actix-http = "3.13.1"
base64 = "0.22.1"
env_logger = "0.11.11"
futures-util = "0.3.31"
log = "0.4.33"
serde = { version = "1.0", features = ["derive"] }
zitadel = { version = "5.7.6", features = ["actix"]}
