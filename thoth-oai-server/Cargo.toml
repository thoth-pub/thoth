[package]
name = "thoth-oai-server"
version = "1.0.4"
authors = ["Javier Arias <javi@thoth.pub>", "Ross Higman <ross@thoth.pub>"]
edition = "2021"
license = "Apache-2.0"
description = "Actix instance serving Thoth's OAI-PMH endpoints"
repository = "https://github.com/thoth-pub/thoth"
readme = "README.md"

[dependencies]
thoth-api = { version = "=1.0.4", path = "../thoth-api", features = ["backend"] }
thoth-errors = { version = "=1.0.4", path = "../thoth-errors" }
thoth-client = { version = "=1.0.4", path = "../thoth-client" }
actix-cors = "0.7.1"
actix-web = "4.10"
base64 = "0.22.1"
chrono = { version = "0.4.40", features = ["serde"] }
env_logger = "0.11.7"
flate2 = "1.1.1"
log = "0.4.26"
quick-xml = "0.36"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
uuid = { version = "1.16.0", features = ["serde"] }
xml-rs = "0.8.25"
