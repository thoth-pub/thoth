[package]
name = "thoth-errors"
version = "1.6.1"
authors = ["Javier Arias <javi@thoth.pub>", "Ross Higman <ross@thoth.pub>"]
edition = "2021"
license = "Apache-2.0"
description = "Errors library for Thoth"
repository = "https://github.com/thoth-pub/thoth"
readme = "README.md"

[dependencies]
actix-web = "4.14.0"
chrono = "0.4.45"
csv = "1.3.1"
deadpool-redis = "0.20.0"
dialoguer = { version = "0.11.0", features = ["password"] }
diesel = { version = "2.3.10", features = ["postgres", "r2d2"] }
juniper = "0.16.1"
marc = { version = "3.1.1", features = ["xml"] }
phf = { version = "0.11", features = ["macros"] }
reqwest = { version = "0.12", features = ["json"] }
reqwest-middleware = "0.4"
serde = "1.0"
serde_json = "1.0.150"
thiserror = "2.0"
tonic = "0.14.6"
uuid = { package = "uuid", version = "1.23.4", features = ["serde", "v4"] }
xml-rs = "0.8.25"
