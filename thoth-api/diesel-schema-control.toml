# Diesel schema convention control (THOTH-DB-CTRL-01)
#
# Reviewable control data enumerating every intentional difference between raw
# `diesel print-schema` output and the canonical `thoth-api/src/schema.rs`.
# It contains no catch-all patterns. Every entry is validated: an unused,
# duplicate, missing, or conflicting entry fails the synchronizer closed.

version = 1

[cli]
diesel_version = "2.3.10"

[config]
print_schema_file = "target/diesel-schema.rs"
canonical_schema = "thoth-api/src/schema.rs"

# ---------------------------------------------------------------------------
# Supplemental canonical-only SQL types.
# Declared in the canonical schema and imported by model tables, but used by no
# column and absent from the database, so raw print-schema never emits them.
# ---------------------------------------------------------------------------

[[supplemental_type]]
diesel_type = "MarkupFormat"
postgres_type = "markup_format"

# ---------------------------------------------------------------------------
# Table aliases: physical PostgreSQL table name -> canonical Rust module name.
# ---------------------------------------------------------------------------

[[table_alias]]
physical = "abstract"
rust = "work_abstract"

[[table_alias]]
physical = "title"
rust = "work_title"

# ---------------------------------------------------------------------------
# Column identifier handling: physical columns diesel renames on raw output
# (trailing underscore + sql_name) but the canonical schema keeps unrenamed
# because the owning table is aliased.
# ---------------------------------------------------------------------------

[[column_identifier]]
rust_table = "work_title"
physical_column = "title"
raw_diesel_column = "title_"
canonical_column = "title"

# ---------------------------------------------------------------------------
# Type overrides: database type presented as a different canonical Diesel type.
# Every older `timestamp without time zone` column is presented as Timestamptz.
# ---------------------------------------------------------------------------

