name: publish-to-dockerhub

on:
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      run_docker: ${{ steps.classify.outputs.run_docker }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify CI changes
        id: classify
        run: python3 .github/scripts/classify_ci_changes.py
  build_and_push_staging_docker_image:
    needs: classify
    if: >-
      ${{
        always() &&
        !cancelled() &&
        (
          needs.classify.result != 'success' ||
          needs.classify.outputs.run_docker == 'true'
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v4
        with:
          # list of Docker images to use as base name for tags
          images: |
            ${{ env.REGISTRY }}/thoth-pub/thoth
          # generate Docker tags based on the following events/attributes
          tags: |
            type=ref,event=pr,prefix=staging-pr-
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            THOTH_EXPORT_API=https://export.test.thoth.pub
      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
