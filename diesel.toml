# For documentation on how to configure this file,
# see diesel.rs/guides/configuring-diesel-cli
#
# THOTH-DB-CTRL-01: automatic Diesel output is untrusted staging only. It is
# written to `target/diesel-schema.rs`, which is under the repository's ignored
# `target/` directory, and never to the canonical `thoth-api/src/schema.rs`.
# Only the validated synchronizer (`.github/scripts/diesel_schema.py generate`)
# may write the canonical schema. Diesel already adds its own `SqlType` derive;
# application model paths and `diesel::sql_types::*` are imports, not derives,
# and must not appear here.

[print_schema]
file = "target/diesel-schema.rs"
custom_type_derives = ["diesel::query_builder::QueryId"]
